name: Temporary approved palette validation
on:
  push:
    branches:
      - theme/approved-plum-cream

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Run Prettier formatter
        run: npm run format
      - name: Show formatted diff
        run: git diff -- src/themes/grim-glimmer/grim-glimmer.css docs/grim-glimmer-theme.md
      - name: Run full suite on formatted source
        run: npm run check
