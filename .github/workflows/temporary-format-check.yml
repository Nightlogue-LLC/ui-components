name: Temporary format and full check
on:
  push:
    branches:
      - design/raised-grim-glimmer-surfaces

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Run Prettier formatter
        run: npm run format
      - name: Show formatted patch
        run: git diff -- src/themes/grim-glimmer/grim-glimmer.css
      - name: Run full suite on formatted code
        run: npm run check
