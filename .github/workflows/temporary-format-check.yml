name: Temporary formatting verification
on:
  push:
    branches:
      - design/raised-grim-glimmer-surfaces

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format
      - name: Verify formatter did not modify files
        run: git diff --exit-code
      - run: npm run check
