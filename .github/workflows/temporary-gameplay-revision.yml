name: Temporary revised gameplay controls validation
on:
  push:
    branches:
      - design/gameplay-board-and-controls-v2

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Format files
        run: npm run format
      - name: Show formatting changes
        run: git diff -- src/projects/grim-glimmer stories/projects/grim-glimmer/Gameplay.stories.ts
      - name: Check after formatting
        run: npm run check
