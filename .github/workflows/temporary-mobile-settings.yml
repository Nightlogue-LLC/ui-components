name: Temporary mobile settings validation
on:
  push:
    branches:
      - design/gameplay-mobile-and-app-settings
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format
      - name: Show formatter edits
        run: git diff -- src/projects/grim-glimmer stories/projects/grim-glimmer
      - run: npm run check
