name: CI

on:
  pull_request:
  push:
    branches: [main, 'agent/**', 'claude/**']

# Cancel superseded runs on the same branch/PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Collect formatted source (temporary diagnostic)
        run: |
          npx prettier --write scripts/promote-reviewed-pr.mjs scripts/promote-reviewed-pr.test.mjs scripts/sync-linear-lifecycle.mjs scripts/sync-linear-lifecycle.test.mjs
          node -e "const fs=require('node:fs');for(const path of ['scripts/promote-reviewed-pr.mjs','scripts/promote-reviewed-pr.test.mjs','scripts/sync-linear-lifecycle.mjs','scripts/sync-linear-lifecycle.test.mjs'])console.log('FORMATTED_SOURCE:'+JSON.stringify({path,content:fs.readFileSync(path,'utf8')}))"
          exit 1

      - name: Lint
        run: npm run lint

      - name: Formatting
        run: npm run format:check

      - name: Type check
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Review automation unit tests
        run: node --test scripts/request-codex-review.test.mjs

      - name: Review readiness and Linear lifecycle unit tests
        run: node --test scripts/promote-reviewed-pr.test.mjs scripts/sync-linear-lifecycle.test.mjs

      - name: Build library
        run: npm run build

      - name: Package check (publint + consumer smoke test)
        run: npm run package:check

      - name: Build Storybook (static catalog)
        run: npm run build-storybook
