name: CI

on:
  pull_request:
  push:
    branches: [main, 'agent/**', 'claude/**']

# Cancel superseded runs on the same branch/PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Formatting diagnostics (temporary)
        run: |
          npx prettier scripts/review-budget.mjs | diff -u scripts/review-budget.mjs - || true
          npx prettier scripts/request-codex-review.mjs | diff -u scripts/request-codex-review.mjs - || true

      - name: Formatting
        run: npm run format:check

      - name: Type check
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Review automation unit tests
        run: node --test scripts/request-codex-review.test.mjs scripts/review-budget.test.mjs

      - name: Review readiness and Linear lifecycle unit tests
        run: node --test scripts/promote-reviewed-pr.test.mjs scripts/sync-linear-lifecycle.test.mjs

      - name: Review gate trigger regression tests
        run: node --test scripts/review-gate-trigger.test.mjs

      - name: Build library
        run: npm run build

      - name: Package check (publint + consumer smoke test)
        run: npm run package:check

      - name: Build Storybook (static catalog)
        run: npm run build-storybook
