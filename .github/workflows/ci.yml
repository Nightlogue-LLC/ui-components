name: CI

on:
  pull_request:
  push:
    branches: [main, 'agent/**', 'claude/**']

# Cancel superseded runs on the same branch/PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Diagnostic format preview (temporary)
        run: |
          echo PRETTIER_START
          npx prettier .github/workflows/open-agent-pr-after-ci.yml | base64 -w0
          echo
          echo PRETTIER_END

      - name: Formatting
        run: npm run format:check

      - name: Type check
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build library
        run: npm run build

      - name: Package check (publint + consumer smoke test)
        run: npm run package:check

      - name: Build Storybook (static catalog)
        run: npm run build-storybook
