name: Promote Codex-cleared Conductor PRs

on:
  issue_comment:
    types: [created, edited]
  workflow_run:
    workflows: [CI]
    types: [completed]
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: read
  pull-requests: read

jobs:
  promote:
    if: >-
      ${{ (github.event_name != 'issue_comment' ||
           (github.event.issue.pull_request != null &&
            github.event.comment.user.login == 'chatgpt-codex-connector[bot]')) &&
          (github.event_name != 'workflow_run' ||
           (github.event.workflow_run.conclusion == 'success' &&
            github.event.workflow_run.head_repository.full_name == 'Nightlogue-LLC/ui-components')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # GitHub keeps one running and one pending run per group and cancels an
    # older pending run when a newer one queues. A Codex comment names exactly
    # one PR, so it gets a per-PR group: another PR's activity cannot displace
    # it. CI-completion, hourly and manual runs re-scan every draft PR, so any
    # newer sweep fully replaces an older pending one and they share a group.
    concurrency:
      group: >-
        nightlogue-review-ready-${{ github.event_name == 'issue_comment' &&
        format('pr-{0}', github.event.issue.number) || 'sweep' }}
      cancel-in-progress: false
    steps:
      - name: Mint restricted Conductor token for ready-for-review mutation
        id: conductor
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ secrets.NIGHTLOGUE_APP_ID }}
          private-key: ${{ secrets.NIGHTLOGUE_APP_PRIVATE_KEY }}
          owner: Nightlogue-LLC
          repositories: ui-components
          permission-contents: read
          permission-pull-requests: write

      - name: Check out trusted default-branch gate only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          persist-credentials: false
          sparse-checkout: |
            scripts/promote-reviewed-pr.mjs
            scripts/review-budget.mjs

      - name: Promote eligible Codex-cleared PRs
        shell: bash
        env:
          GITHUB_READ_TOKEN: ${{ github.token }}
          NIGHTLOGUE_APP_TOKEN: ${{ steps.conductor.outputs.token }}
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "issue_comment" ]]; then
            PR_NUMBER="$EVENT_PR_NUMBER" node scripts/promote-reviewed-pr.mjs
          else
            gh api 'repos/Nightlogue-LLC/ui-components/pulls?state=open&per_page=100' \
              --jq '.[] | select(.draft == true and .user.login == "nightlogue-conductor[bot]") | .number' \
              | while read -r pr_number; do
                  PR_NUMBER="$pr_number" node scripts/promote-reviewed-pr.mjs
                done
          fi
