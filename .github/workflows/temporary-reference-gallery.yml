name: Temporary reference gallery validation
on:
  push:
    branches:
      - design/plum-cream-reference-gallery

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Run Prettier formatter
        run: npm run format
      - name: Show formatting changes
        run: git diff -- stories/projects/grim-glimmer/ReferenceGallery.stories.ts stories/reference-gallery.css
      - name: Complete checks
        run: npm run check
