name: Temporary Prettier and check
on:
  push:
    branches:
      - design/occult-editorial-primitives

permissions:
  contents: read

jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format
      - name: Output formatter diff
        run: git diff -- src stories
      - name: Complete check suite
        run: npm run check
