name: Temporary Prettier and full validation
on:
  push:
    branches:
      - design/occult-editorial-primitives

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Run Prettier formatter
        run: npm run format
      - name: Inspect formatter output
        run: git diff -- src/components src/themes/grim-glimmer/grim-glimmer.css stories
      - name: Run entire check suite on formatted source
        run: npm run check
